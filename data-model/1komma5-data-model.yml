api: 1KOMMA5° Offer Tool API
entities:
- name: Tenant
  description: Top-level partition of the Offer Tool. Every user has an active tenant and
    a default tenant, and list endpoints filter by tenantId.
  paths:
  - /api/v1/tenant
  - /api/v1/tenant/switch
  schemas: [TenantDto, AdminUserTenantDto]
  key_fields: [id, tenantId, activeTenantId, defaultTenantId, tenantIds]
- name: Branch
  description: A physical/organisational branch inside a tenant; admin users are assigned
    to branches.
  paths:
  - /api/v1/admin/branches
  - /api/v1/admin/branches/{id}
  - /api/v1/admin/users/me/branches
  - /api/v1/admin/users/assignable-branches
- name: User
  description: An authenticated Offer Tool user (sales person or admin), backed by Auth0.
  paths:
  - /api/v1/users
  - /api/v1/users/me
  - /api/v1/users/me/profile-picture
  - /api/v1/users/sales-persons
  - /api/v1/admin/users
  - /api/v1/admin/users/{id}
  key_fields: [id, zohoUserId, currentTeamId, activeTenantId, defaultTenantId]
- name: Role
  description: Assignable role controlling what an admin user may do.
  paths:
  - /api/v1/admin/roles
  schemas: [AssignableRolesResponseDto, AccessLevel]
- name: Customer
  description: The end customer a quote is built for.
  paths:
  - /api/v1/customers
  - /api/v1/customers/{id}
  - /api/v1/customers/{id}/details
  schemas: [CustomerFullSchemaDto, CustomerCreateInputDto, SalesContactCustomerDto]
  key_fields: [id, zohoId, salesContactId]
- name: Site
  description: The property/installation address a system is quoted for. Sites hang off a
    customer and carry images and energy-service lookups.
  paths:
  - /api/v1/customers/{customerId}/sites
  - /api/v1/sites/{id}/lookup-energy-service-data
  schemas: [SiteResponseDto, SiteFormFieldsDto, SiteImage, SiteImageMeta, AddressDto]
- name: Config
  description: An offer configuration — the central working object. Carries products,
    documents, tables, margins, metrics, self-sufficiency, market components and effective
    prices, and is what gets rendered to PDF and sent to the customer.
  paths:
  - /api/v1/configs/{id}
  - /api/v1/configs/{id}/send-offer
  - /api/v1/configs/{configId}/pdf
  - /api/v1/configs/{id}/lookup-energy-service-data
  schemas: [ConfigDetailsResponseDto, SendOfferRequestDto, SendOfferResponseDto]
  key_fields: [id, configId, hashId, getAcceptDocumentId]
- name: Concept
  description: A reusable offer template/blueprint a config is built from, scoped and
    versioned by visibility.
  paths:
  - /api/v1/concepts-public
  - /api/v1/admin/concepts
  - /api/v1/admin/concepts/{id}
  schemas: [ConceptTemplateType, ConceptScope, ConceptVisibility, ConceptSortField]
- name: Product
  description: A sellable item (module, inverter, battery, heat pump, wallbox) with brand,
    category, media and price.
  paths:
  - /api/v1/product
  - /api/v1/product/{id}
  - /api/v1/admin/products
  - /api/v1/admin/products/{id}
  schemas: [ProductDTO, ProductGetAllResponse, PriceDTO, MediaDTO]
- name: Category
  description: Product taxonomy node.
  paths:
  - /api/v1/admin/categories
  schemas: [CategoryDTO, CategoryDto]
- name: Brand
  description: Product manufacturer.
  paths:
  - /api/v1/admin/brands
  schemas: [BrandDTO, BrandDto]
- name: Pricebook
  description: Tenant/country-scoped pricing for products.
  paths:
  - /api/v1/admin/pricebook
  schemas: [PriceDTO, Currency]
- name: PaymentOption
  description: Available payment/financing option offered with a quote.
  paths:
  - /api/v1/payment-options
  schemas: [GetAllPaymentOptionsDtoResponse]
- name: EffectivePrice
  description: German-market effective electricity price simulation attached to a quote.
  paths:
  - /api/v1/effective-price/de
  - /api/v1/effective-price/de/check-simulation-data
- name: Country
  description: Country reference data driving locale, currency and market rules.
  paths:
  - /api/v1/admin/countries
  schemas: [CountryDto, CountryCode, Locale, Currency]
- name: Deal
  description: CRM deal (Zoho) an offer is attached to; offers can be rejected back into
    the CRM.
  paths:
  - /api/v1/crm/deals/{dealId}
  - /api/v1/crm/reject-offer/{crmOfferId}
  key_fields: [zohoId]
- name: AuditLog
  description: Immutable record of an action, with actor, subject, traceId and free-form
    metadata.
  paths:
