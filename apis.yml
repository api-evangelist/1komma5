aid: 1komma5
name: 1KOMMA5°
description: '1KOMMA5° (1Komma5 Grad) is a Hamburg, Germany headquartered smart-energy
  company that sells, installs and operates integrated residential energy systems —
  rooftop photovoltaics, battery storage, heat pumps and EV charging — and ties them
  together with Heartbeat AI, its energy-management platform. Heartbeat aggregates
  customer hardware into one of Europe''s largest residential virtual power plants,
  optimising self-consumption and trading household flexibility against day-ahead and
  intraday electricity markets. The company operates across Germany, Australia, the
  Netherlands, Sweden, Finland, Denmark and Belgium. Its machine-readable surface is
  small and mostly internal: a live OpenAPI 3.0 for the Offer Tool API used by its
  sales and partner network, an Auth0-backed OIDC provider at auth.1komma5grad.com,
  and the undocumented Heartbeat customer API that its mobile apps and community-built
  Home Assistant integrations consume.'
