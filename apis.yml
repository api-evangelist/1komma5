apis:
- name: 1KOMMA5° Heartbeat API
  description: >-
    The Heartbeat API is the customer-facing energy API behind the 1KOMMA5° mobile apps and the Heartbeat
    AI platform — sites and systems, live power snapshots for PV, battery, heat pump and EV charger, energy
    summaries, dynamic electricity prices from the energy trader, self-sufficiency figures and Heartbeat
    AI optimisation decisions. 1KOMMA5° publishes no developer documentation and no machine-readable description
    for it; the host was probed live (an anonymous 200 on /api/v1/supported-versions) and the surface
    is additionally documented by community-built Python clients and Home Assistant integrations. Authentication
    is OAuth 2.0 authorization code + PKCE against auth.1komma5grad.com.
  humanURL: https://help.1komma5.com.au/heartbeat/
