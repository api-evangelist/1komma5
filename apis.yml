apis:
- name: 1KOMMA5° Offer Tool API
  description: 'The Offer Tool API backs 1KOMMA5°''s sales configuration and quoting
    workflow — customers and sites, product and pricebook catalogues, concepts, effective-price
    simulation for the German market, offer configurations, PDF offer generation, CRM
    deal lookup, and tenant/branch/user administration with audit logging. It serves
    a live OpenAPI 3.0.0 description at /swagger-json covering 60 paths, 73 operations
    and 130 component schemas. Access is bearer-token gated (Auth0); the Swagger UI
    at /swagger is behind HTTP Basic.'
  humanURL: https://api.offer.1komma5grad.com/
  baseURL: https://api.offer.1komma5grad.com
  tags:
  - Offers
  - Quoting
  - CRM
  - Pricing
  - Solar
  properties:
  - type: OpenAPI
    url: openapi/1komma5-offer-tool-openapi-original.json
  - type: Overlay
    url: overlays/1komma5-offer-tool-overlay.yaml
  - type: x-evidence
    url: https://api.offer.1komma5grad.com/swagger-json
- name: 1KOMMA5° Heartbeat API
  description: 'The Heartbeat API is the customer-facing energy API behind the 1KOMMA5°
    mobile apps and the Heartbeat AI platform — sites and systems, live power snapshots
    for PV, battery, heat pump and EV charger, energy summaries, dynamic electricity
    prices from the energy trader, self-sufficiency figures and Heartbeat AI optimisation
    decisions. 1KOMMA5° publishes no developer documentation and no machine-readable
    description for it; the host was probed live (an anonymous 200 on /api/v1/supported-versions)
    and the surface is additionally documented by community-built Python clients and
    Home Assistant integrations. Authentication is OAuth 2.0 authorization code + PKCE
    against auth.1komma5grad.com.'
  humanURL: https://help.1komma5.com.au/heartbeat/
