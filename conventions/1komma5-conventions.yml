  idempotency_key_header: null
  note: >-
    No Idempotency-Key header, parameter, or documented retry-safety contract exists on
    either API. One maintenance operation
    (BackfillConfigHashesController_backfillConfigHashes_v1) is *described* as
    "Idempotent one-shot maintenance task", but that is a property of that single job,
    not an API-wide idempotency contract. No `Idempotency` pointer is emitted for this
    provider.
