note: >-
  1KOMMA5° publishes no API conventions/design guide. Everything below is derived from
  the live Offer Tool OpenAPI and from response headers observed on the Offer Tool and
  Heartbeat hosts. Where a convention is absent it is recorded as absent — that is real
  data, not a gap to fill.
authentication:
  style: OAuth 2.0 / OIDC bearer token (Auth0)
  header: authorization
  issuer: https://auth.1komma5grad.com/
  detail: authentication/1komma5-authentication.yml
  notes:
  - The Offer Tool spec declares the `authorization` header as an explicit operation
    parameter on two operations rather than via components.securitySchemes.
  - The Swagger UI at /swagger is additionally protected by HTTP Basic (it answers 401
    with a WWW-Authenticate Basic challenge), while the raw description at /swagger-json
    is anonymous.
idempotency:
