note: >-
  Neither 1KOMMA5° API uses RFC 9457 application/problem+json — no `type`/`title`/
  `detail` members and no problem media type anywhere in the Offer Tool spec. Both
  services return a proprietary JSON envelope, and the two envelopes DIFFER from each
  other. The Offer Tool spec also names no error schema in components.schemas, so the
  shapes below were captured from live anonymous probes and the status/description
  pairs were derived from the spec's own response objects.
envelopes:
- api: 1KOMMA5° Offer Tool API
  host: https://api.offer.1komma5grad.com
  media_type: application/json
  fields:
  - name: message
    type: string
    description: Human-readable error message.
  - name: path
    type: string
    description: Request path that produced the error.
  - name: statusCode
    type: integer
    description: HTTP status code, repeated in the body.
  - name: success
    type: boolean
    description: Always false on an error response.
  example: '{"message":"Cannot GET /nope","path":"/nope","statusCode":404,"success":false}'
  observed:
    url: https://api.offer.1komma5grad.com/nope
    http_status: 404
- api: 1KOMMA5° Heartbeat API
  host: https://heartbeat.1komma5grad.com
  media_type: application/json
  fields:
  - name: error_code
    type: integer
    description: Proprietary numeric error code. Observed values encode the HTTP status
      in the low three digits behind a 60 prefix (60404 for 404, 60401 for 401).
  - name: correlation_id
    type: string
    format: uuid
    description: Per-request correlation id — the only request-tracing identifier either
      API surfaces. Quote it when contacting support.
  - name: message
    type: string
    description: Human-readable error message.
  examples:
  - '{"error_code":60404,"correlation_id":"0afb1d51-...","message":"Cannot GET /nope"}'
  - '{"error_code":60401,"correlation_id":"bed9ffc2-...","message":"Unauthorized"}'
  observed:
  - url: https://heartbeat.1komma5grad.com/nope
    http_status: 404
  - url: https://heartbeat.1komma5grad.com/api/v2/systems
    http_status: 401
